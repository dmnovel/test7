/* neutral flat polish: CSS only, no layout/function changes */
body{
  background:#F7F7F8;
}
.panel,
.card,
.empty,
.error,
.install-banner,
.history-modal,
.date-index-modal,
.taste-modal,
.taste-card{
  border-radius:4px !important;
  border-color:#E5E7EB !important;
  box-shadow:0 1px 4px rgba(0,0,0,.035) !important;
}
input,
select,
button,
.back-to-main,
.top-menu-btn,
.heart-top-btn,
.blank-top-btn,
.history-btn,
.move-btn,
.load-more-wrap button{
  border-radius:4px !important;
}
.history-pill,
.history-pill.recent,
.history-rate,
.date-chip,
.clear-date-btn{
  border-radius:4px !important;
}
.float-nav button,
.history-close,
.favorite-toggle,
.blank-top-btn.small,
.heart-top-btn.small{
  border-radius:4px !important;
}
.search-row input,
.detail-row input,
select{
  background:#FFFFFF;
  border-color:#E5E7EB;
  box-shadow:none;
}
input:focus,
select:focus,
button:focus{
  border-color:#9370DB;
  box-shadow:0 0 0 2px rgba(183,138,150,.13);
}
button{
  box-shadow:none;
}
.card{
  background:#FFFFFF;
}
.book-title{
  color:#27272A;
}
.book-meta{
  color:#52525B;
}
.history-pill{
  background:#F2F0FA;
  border-color:#E5E7EB;
  color:#7B68B6;

  background:#F4F4F5;
  border-color:#E5E7EB;

.history-row,
.history-empty,
.date-chip{

@media(max-width:980px){

    width:16px;

function loadFavoriteData(){const legacy=readJsonStorage(FAVORITE_LEGACY_KEY,[]);const saved=readJsonStorage(FAVORITE_LISTS_STORAGE_KEY,null);let lists=saved&&saved.lists&&typeof saved.lists==='object'?saved.lists:null;let names=saved&&saved.names&&typeof saved.names==='object'?saved.names:null;if(!lists){lists={fav1:Array.isArray(legacy)?legacy:[],fav2:[],fav3:[]};names={fav1:'',fav2:'',fav3:''}}['fav1','fav2','fav3'].forEach(id=>{if(!Array.isArray(lists[id]))lists[id]=[];if(!Object.prototype.hasOwnProperty.call(names,id))names[id]=''});let activeId=localStorage.getItem(ACTIVE_FAVORITE_LIST_KEY)||'fav1';if(!lists[activeId])activeId='fav1';return{lists,names,activeId}}
const loadedFavoriteData=loadFavoriteData();
const state={items:[],filtered:[],visibleCount:PAGE_SIZE,viewMode:localStorage.getItem('dm_view_mode')||'list',favoriteLists:loadedFavoriteData.lists,favoriteNames:loadedFavoriteData.names,activeFavoriteListId:loadedFavoriteData.activeId,favorites:new Set(loadedFavoriteData.lists[loadedFavoriteData.activeId]||[]),cartIds:new Set(JSON.parse(localStorage.getItem(CART_STORAGE_KEY)||'[]')),targetPrice:Number(localStorage.getItem(TARGET_STORAGE_KEY)||0)||0,showFavorites:false,showCart:false};
const els={q:document.getElementById('q'),searchBtn:document.getElementById('searchBtn'),sortBy:document.getElementById('sortBy'),resetBtn:document.getElementById('resetBtn'),titleOnly:document.getElementById('titleOnly'),authorOnly:document.getElementById('authorOnly'),exclude:document.getElementById('exclude'),discountRate:document.getElementById('discountRate'),pricePreset:document.getElementById('pricePreset'),typeFilter:document.getElementById('typeFilter'),favDiscountRate:document.getElementById('favDiscountRate'),favPricePreset:document.getElementById('favPricePreset'),favoriteListBar:document.getElementById('favoriteListBar'),favListMenuBtn:document.getElementById('favListMenuBtn'),favListSelect:document.getElementById('favListSelect'),favListCount:document.getElementById('favListCount'),favListMenu:document.getElementById('favListMenu'),favListAddBtn:document.getElementById('favListAddBtn'),favListDeleteBtn:document.getElementById('favListDeleteBtn'),favListNameInput:document.getElementById('favListNameInput'),favListRenameBtn:document.getElementById('favListRenameBtn'),resultCount:document.getElementById('resultCount'),activeSummary:document.getElementById('activeSummary'),list:document.getElementById('list'),empty:document.getElementById('empty'),error:document.getElementById('error'),loadMoreWrap:document.getElementById('loadMoreWrap'),loadMoreBtn:document.getElementById('loadMoreBtn'),goTopBtn:document.getElementById('goTopBtn'),goBottomBtn:document.getElementById('goBottomBtn'),bottomAnchor:document.getElementById('bottomAnchor'),detailToggleBtn:document.getElementById('detailToggleBtn'),detailRow:document.getElementById('detailRow'),cartMount:document.getElementById('cartMount'),desktopCartMount:document.getElementById('desktopCartMount'),desktopCartDock:document.getElementById('desktopCartDock'),cartTopBtn:document.getElementById('cartTopBtn'),cartToast:document.getElementById('cartToast')};
function normalizeText(value){return String(value??'').trim().toLowerCase().replace(/\s+/g,'')}
function toNumber(value){if(typeof value==='number')return value;const text=String(value??'').replace(/[^\d.-]/g,'');const num=Number(text);return Number.isFinite(num)?num:0}
function formatPrice(price){const num=Number(price)||0;return num.toLocaleString('ko-KR')+'원'}
function formatDiscount(d){const n=Number(d)||0;return n?n+'%':''}

function parseHistory(value){return String(value||'').split(',').map(v=>v.trim()).filter(Boolean).map(v=>{const m=v.match(/^(\d{6}\S*)\s+(.*)$/);return m?{date:m[1],rate:m[2].trim()||'-'}:{date:'기록',rate:v}})}
function latestHistoryEntry(value){const entries=parseHistory(value).filter(entry=>entry.date&&entry.date!=='기록');if(!entries.length)return null;return [...entries].sort((a,b)=>String(b.date).slice(0,6).localeCompare(String(a.date).slice(0,6),'ko-KR',{numeric:true}))[0]}
function itemKeyRaw(item,index){return String(item.workId||item.id||item.link||`${item.title}__${item.author}__${index}`)}

function normalizeItem(item,index){const title=String(item.title??'').trim();const author=String(item.author??'').trim();const history=String(item.history??'').trim();const historyItems=parseHistory(history);return{workId:String(item.workId??item.id??'').trim(),id:itemKeyRaw(item,index),title,author,_titleNorm:normalizeText(title),_authorNorm:normalizeText(author),_joinedNorm:normalizeText(title+author),link:String(item.link??'').trim(),discount:toNumber(item.discount),price:toNumber(item.price),type:String(item.type??'').trim(),cover:String(item.cover??item.coverUrl??item.thumbnail??item.image??item.img??item['표지주소']??item['표지']??'').trim(),history,_historyItems:historyItems,_historyCache:null,appearCount:historyItems.length,latestEntry:latestHistoryEntry(history),originalIndex:index}}
function hasSearchCriteria(){return Boolean(els.q.value.trim()||els.titleOnly.value.trim()||els.authorOnly.value.trim()||els.exclude.value.trim()||els.discountRate.value||els.pricePreset.value||els.typeFilter.value)}
function getPriceRange(){if(!els.pricePreset.value)return{min:null,max:null};const[min,max]=els.pricePreset.value.split('-').map(Number);return{min,max}}

function getCartTotal(){return getCartItems().reduce((s,i)=>s+Number(i.price||0),0)}
function getRemain(){return Number(state.targetPrice||0)-getCartTotal()}
function applySort(list){const sort=els.sortBy.value,arr=[...list];const byText=f=>(a,b)=>String(a[f]||'').localeCompare(String(b[f]||''),'ko-KR',{numeric:true});if(sort==='titleAsc')arr.sort(byText('title'));if(sort==='authorAsc')arr.sort(byText('author'));if(sort==='priceAsc')arr.sort((a,b)=>a.price-b.price);if(sort==='priceDesc')arr.sort((a,b)=>b.price-a.price);if(sort==='discountDesc')arr.sort((a,b)=>b.discount-a.discount);if(sort==='underRemainAsc'||sort==='underRemainDesc'){const usable=getRemain()>0?getRemain():-1;arr.sort((a,b)=>{const af=a.price<=usable?0:1,bf=b.price<=usable?0:1;if(af!==bf)return af-bf;return sort==='underRemainAsc'?a.price-b.price:b.price-a.price})}if(sort==='default')arr.sort((a,b)=>a.originalIndex-b.originalIndex);return arr}
function filterFavoriteItems(list){let arr=applySort(list);const discount=els.favDiscountRate?.value||'';const priceSort=els.favPricePreset?.value||'';if(discount)arr=arr.filter(item=>String(item.discount)===discount);if(priceSort==='priceAsc')arr.sort((a,b)=>a.price-b.price);if(priceSort==='priceDesc')arr.sort((a,b)=>b.price-a.price);return arr}
function applyFilters(){const q=normalizeText(els.q.value),titleOnly=normalizeText(els.titleOnly.value),authorOnly=normalizeText(els.authorOnly.value),exclude=normalizeText(els.exclude.value),discount=els.discountRate.value,type=els.typeFilter.value,range=getPriceRange();let result=state.items.filter(item=>{const title=item._titleNorm,author=item._authorNorm,joined=item._joinedNorm;if(q&&!(title.includes(q)||author.includes(q)))return false;if(titleOnly&&!title.includes(titleOnly))return false;if(authorOnly&&!author.includes(authorOnly))return false;if(exclude&&joined.includes(exclude))return false;if(discount&&String(item.discount)!==discount)return false;if(type&&item.type!==type)return false;if(range.min!==null&&item.price<range.min)return false;if(range.max!==null&&item.price>range.max)return false;return true});state.filtered=applySort(result);state.visibleCount=PAGE_SIZE;updateSummary();render(false)}
function updateSummary(){const p=[];if(els.q.value.trim())p.push(`통합: ${els.q.value.trim()}`);if(els.sortBy.value!=='default')p.push(`정렬: ${els.sortBy.options[els.sortBy.selectedIndex].textContent}`);if(els.discountRate.value)p.push(`할인율: ${els.discountRate.value}%`);if(els.pricePreset.value)p.push(`금액대: ${els.pricePreset.options[els.pricePreset.selectedIndex].textContent}`);if(els.typeFilter.value)p.push(`구매유형: ${els.typeFilter.value}`);if(els.titleOnly.value.trim())p.push(`제목: ${els.titleOnly.value.trim()}`);if(els.authorOnly.value.trim())p.push(`작가: ${els.authorOnly.value.trim()}`);if(els.exclude.value.trim())p.push(`제외: ${els.exclude.value.trim()}`);els.activeSummary.textContent=p.length?p.join(' · '):'필터 없음'}
function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function populateFilters(){const rates=[...new Set(state.items.map(item=>item.discount).filter(Boolean))].sort((a,b)=>b-a);const discountOptions='<option value="">전체 할인율</option>'+rates.map(rate=>`<option value="${rate}">${rate}%</option>`).join('');els.discountRate.innerHTML=discountOptions;if(els.favDiscountRate)els.favDiscountRate.innerHTML=discountOptions;const types=[...new Set(state.items.map(item=>item.type).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko-KR',{numeric:true}));els.typeFilter.innerHTML='<option value="">전체 유형</option>'+types.map(type=>`<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`).join('')}
function openHistoryModal(item){trackItemEvent('history_open',item,{history_count:(item._historyItems||[]).length});const backdrop=document.getElementById('historyModalBackdrop'),title=document.getElementById('historyModalTitle'),meta=document.getElementById('historyModalMeta'),body=document.getElementById('historyModalBody');title.textContent=item.title||'과거 할인율';meta.textContent=(item.author||'작가 정보 없음')+' · 과거 마크다운 할인율';body.innerHTML='';const entries=item._historyCache||(item._historyCache=item._historyItems);if(!entries.length){const empty=document.createElement('div');empty.className='history-empty';empty.textContent='정리된 과거 할인율이 없습니다.';body.appendChild(empty)}else{entries.forEach(entry=>{const row=document.createElement('div');row.className='history-row';const date=document.createElement('span');date.className='history-date';date.textContent=entry.date;const rate=document.createElement('span');rate.className='history-rate';rate.textContent=entry.rate;row.append(date,rate);body.appendChild(row)})}backdrop.classList.add('open');backdrop.setAttribute('aria-hidden','false');document.body.classList.add('modal-open')}
